name: Docker Build, Push, and Deploy

on:
push:
branches: [ "week02" ]

jobs:
build:
runs-on: ubuntu-latest

```
steps:
- name: Checkout code
  uses: actions/checkout@v4

- name: Set up Docker Buildx
  uses: docker/setup-buildx-action@v3

- name: Login to Docker Hub
  uses: docker/login-action@v3
  with:
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

- name: Build Docker image
  run: |
    docker build -t aryansarode/cs6620-app:latest .

- name: Push Docker image
  run: |
    docker push aryansarode/cs6620-app:latest
```

deploy:
needs: build
runs-on: ubuntu-latest

```
steps:
- name: Configure AWS Credentials
  uses: aws-actions/configure-aws-credentials@v4
  with:
    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
    aws-region: ${{ secrets.AWS_REGION }}

- name: Deploy to EC2 using SSM
  run: |
    aws ssm send-command \
      --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "docker pull aryansarode/cs6620-app:latest",
        "docker stop cs6620-app || true",
        "docker rm cs6620-app || true",
        "docker run -d --name cs6620-app -p 80:3000 --restart unless-stopped aryansarode/cs6620-app:latest"
      ]' \
      --region ${{ secrets.AWS_REGION }}
```

